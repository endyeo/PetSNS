</style><body><header><small>PetSNS · 독립 개발 워크플로</small><h1 id="title"></h1><p id="identity"></p></header><nav id="tabs" aria-label="보고서 탭"></nav><main id="content"></main><footer><button id="save">회차 저장·JSON 다운로드</button><label class="button">승인 JSON 가져오기<input id="import" type="file" accept="application/json"></label><p id="message" role="status"></p><small>선택은 이 브라우저에 저장됩니다. 이동 전 JSON을 내려받으세요. 저장 실패 시 다운로드를 중단합니다.</small></footer><script id="report-data" type="application/json">{"schemaVersion":1,"project":"PetSNS","taskId":"WORKFLOW-01","repository":"endyeo/PetSNS","revision":"e0663e1c055fda3c4882f250c764a40e7b1fa7fd","sources":[{"path":"PRD.md","sha256":"a7b83747954b06a9d8ea846f219b32d14682781c43436dc1db9d909d8b8cda16","excerpt":"# PetSNS Feature PRD and Acceptance Criteria\r\n\r\nBasis: repository code, existing test cases, and the service plan, reviewed on October 9, 2026. Supabase implementation and verification records T27/T28 were added on October 10, 2026.\n\r\n## How to use this document\r\n\r\nChoose one linked task PRD and implement or change only that behavior. Each task defines prerequisites, the user flow, rules, the result, and observable acceptance criteria. Dependencies must exist or be supplied as test fixtures; a task is not a separate application.\r\n\r\n**T01–T25 describe the current implementation as a baseline, not newly approved product decisions. T26 is a confirmed planning requirement missing from the code.** Acceptance criteria are checks to perform, not a claim that this review ran or passed tests. Resolve the decisions at the end before changing affected behavior.\n\nT27 records the completed development DB/RLS foundation. T28 connects actual Supabase login, logout, and verified session restoration. T29 connects guardian profile initialization and pet CRUD/Day 0; T30 connects daily journals and restrictive pet deletion. T31 connects private memory photos, Storage and recoverable cleanup; T32 adds private pet profile photos with atomic profile updates. Web hosting is intentionally deferred.\r\n\nCOMMON-UI-01 establishes global navigation styling, Material 3 surface tint removal, and design token consistency across components. HOME-UI-01 improves the home screen day profile header layout, D+ badge placement, and calendar cleanliness.\n\r\nEach linked file is one assignable feature PRD. Shared boundaries and unresolved decisions live here to avoid repeating them in every task. Existing Korean interface labels remain unchanged.\r\n\r\n## Shared boundaries\r\n\r\n- Scope: Flutter web and Android. Builds with Supabase settings, profile/release builds, and web builds on non-loopback hosts use server Auth. Unconfigured local debug builds retain demo authentication. Online pets, Day 0, journals, private memory and profile photos use Supabase; local JSON is preserved without automatic import. Other domains remain local; online membership writes remain pending. SDK Auth sessions use separate storage. Pets, journals and photos are reread on login/restart; real-time synchronization is not implemented. Profile photos are owner-only; future shared profiles require an explicit access policy.\r\n- All tasks except startup and authentication require a signed-in account. Personal profiles, photos, and journals are scoped to their owner; shared posts and room membership have their own rules below.\r\n- Successful stored changes survive reopening on the same storage/origin. A rejected or failed stored change reports an error and restores the previous in-memory data; an overlapping store mutation is rejected. Canceling an unsaved form does not create a record.\r\n- Meetup dates, deadlines, chat closure, and memory “today” use Korean time (KST). The pet birthday picker currently uses device-local today. Day 0 counts calendar days, with the starting date equal to 0.\r\n- Selected profile/memory photos are checked in the picker; chat photos are also checked by the store. The byte limit is `3 * 1024 * 1024` (3,145,728 bytes) per image after reading the selected file. Do not assume these validation layers are identical.\r\n- Completion requires checking the task's successful path, rejected inputs/access where specified, and persistence for changed stored data. Relevant code-change verification follows the `coding-principles` skill; this PRD does not duplicate its workflow.\r\n\r"},{"path":"docs/human/task record/HOME-UI-01/PRD.md","sha256":"abfecb5affd8ae053f604295d20e611e22f5b679b4b7ffbb0f2601c1f9fcdd5b","excerpt":"# PetSNS 홈 화면 반려동물 프로필 UI 개선 (HOME-UI-01)\n\n- **작업 ID**: HOME-UI-01\n- **대상 화면**: H · 홈 · 우리의 하루\n- **변경 요소**: H-02, H-03, H-04, H-05\n- **작업 범위**: UI 레이아웃 및 표시 정보 변경\n\n---\n\n## 1. 작업 목적\n\n주간 달력의 Day 표시를 반려동물 사진으로 옮기고, 추억 기록 버튼 위치 변경과 사진 위에 있는 텍스트(이름, 종, 생일)에서 생일을 제거한다.\n\n---\n\n## 2. 상세 변경 요구사항\n\n### 2.1 H-02 사진·가족 박스\n- 기존 사진 영역과 연결된 흰색 가족 정보 박스 구조를 기준으로 수정.\n- `'가족 1 / 2 마리'` 문구 제거.\n- 제거한 문구 위치에 **H-05**(페이지 인디케이터 도트) 배치.\n- 기존 표시되던 생일 정보는 화면에서 제거.\n- 생일 데이터 자체는 삭제하지 않고 유지.\n\n### 2.2 H-03 고정 추억 기록 버튼 & Day 표시\n- 사진 우측 하단에 `'추억 기록'` 버튼 위치 수정.\n- 선택된 반려동물의 기존 Day 0이 아닌 1 기준(Day 1)을 사용하여 사진 우측 상단에 `D+숫자`(예: `D+30`) 표시.\n- Day 미설정 시 기존 앱의 미설정 처리 정책(`'기준 설정'`) 적용 (임의의 숫자 미표시, 탭 시 설정 창 호출).\n- D+ 배지의 글자 색상은 검정색(`Colors.black`), 배경색은 앱 전체 배경색(`AppColors.canvas`, `#FAF8F3`)과 동일하게 적용.\n- 추억 기록 버튼의 기존 동작(해당 반려동물의 오늘 추억 작성) 유지.\n\n### 2.3 H-04 주간 달력\n- 오늘 날짜 아래 표시되던 작은 `Day 30` 등의 Day 문구 제거.\n- 기존 7일 주간 달력 구조 유지.\n- 날짜 선택 기능 유지.\n- 참여 약속 날짜의 노란색(`AppColors.anniversary`) 강조 표시 유지.\n- 날짜 선택 시 하단 추억 및 약속 미리보기 갱신 기능 유지.\n- 제거된 Day 정보는 H-03(사진 우측 상단)에서 확인 가능.\n\n### 2.4 H-05 사진 제스처 안내\n- 사진 좌우 제스처(스와이프/드래그) 기능 유지.\n- 반려동물 전환 시 이름, 종, D+숫자가 함께 갱신.\n- 기존 가이드의 '사진만 제스처로 이동, 프로필 글·버튼은 고정' 규칙 유지.\n- 제스처 안내 문구(`'좌우로 넘겨 보세요'`) 제거, 페이지 표시(인디케이터 점)는 기존 상태 유지하되 가족 정보 박스로 이동.\n\n---\n\n## 3. 완료 기준 (Acceptance Criteria) 확인\n\n| 항목 | 완료 기준 | 상태 | 검증 근거 |\n|---|---|:---:|---|\n| 1 | H-03 추억 기록 버튼이 사진의 우측 하단에 배치 | ✅ 통과 | 사진 배너 우측 하단 `FilledButton` 배치 확인 |\n| 2 | '가족 1 / 2 마리' 문구가 제거 | ✅ 통과 | 하단 흰색 가족 박스에서 텍스트 제거 확인 |\n| 3 | H-05가 안내 문구 없이 표시 | ✅ 통과 | 안내 문구 없이 페이지 인디케이터 도트만 가족 박스에 표시 확인 |\n| 4 | 생일 정보는 화면에서만 제거 | ✅ 통과 | 배너에서 생일 텍스트 제거, pet 데이터의 birthday 보존 확인 |\n| 5 | 사진 우측 상단에 D+숫자 표시 | ✅ 통과 | 사진 배너 우측 상단에 `D+31`, `D+2` 표시 확인 |\n| 6 | 글자 색상은 검정색 | ✅ 통과 | D+ 배지 텍스트 `Colors.black` 적용 확인 |\n| 7 | 배경색은 앱 전체 배경색과 동일 | ✅ 통과 | D+ 배지 배경 `AppColors.canvas` (`#FAF8F3`) 적용 확인 |\n| 8 | 추억 기록 버튼의 기존 기능 유지 | ✅ 통과 | 버튼 탭 시 해당 반려동물의 추억 작성 모달 정상 호출 |\n| 9 | H-04의 작은 Day 문구 제거 | ✅ 통과 | 주간 달력 날짜 아래 Day 문구 제거 확인 |\n| 10 | 주간 달력의 날짜 선택과 약속 강조 정상 동작 | ✅ 통과 | 날짜 선택 시 미리보기 갱신 및 약속 날짜 노란색 강조 정상 동작 |\n| 11 | 사진 좌우 제스처로 반려동물 변경 | ✅ 통과 | 드래그/스와이프로 모카 ↔ 루나 전환 정상 동작 |\n| 12 | 반려동물 변경 시 이름, 종, D+숫자 갱신 | ✅ 통과 | 모카(골든 리트리버, D+31) ↔ 루나(코리안 쇼트헤어, D+2) 정상 갱신 |\n| 13 | 사진, 버튼, 텍스트가 모바일/웹에서 겹치지 않음 | ✅ 통과 | 모바일(360px), 웹(1024px) 모두 레이아웃 오버랩 없음 확인 |\n| 14 | flutter analyze 및 관련 test 통과 | ✅ 통과 | `analyze_files` 0 errors, 전체 78개 테스트 통과 |\n\n---\n\n## 4. 완료 기준 스크린샷 증적\n"},{"path":"lib/screens/dashboard_tab.dart","sha256":"11a4c0b8554f1505a13fb65a52addf091859a61ef5164568f4f6cf8816dd1d7c","excerpt":"import 'package:flutter/material.dart';\r\nimport '../store.dart';\r\nimport '../design_system.dart';\r\nimport '../widgets/common.dart';\r\nimport 'home_content.dart';\r\nimport 'home_model.dart';\r\nimport '../home_week_calendar.dart';\r\nimport '../pet_profile_carousel.dart';\r\n\r\nclass DashboardTab extends StatelessWidget {\r\n  const DashboardTab({\r\n    super.key,\r\n    required this.model,\r\n    required this.hostContext,\r\n  });\r\n  final HomeModel model;\r\n  final BuildContext hostContext;\r\n  @override\r\n  Widget build(BuildContext context) =>\r\n      _DashboardTabContent(hostContext, model).render();\r\n}\r\n\r\nclass _DashboardTabContent extends HomeContent {\r\n  _DashboardTabContent(super.context, super.model);\r\n  Widget render() => dashboard();\r\n  Future\u003cvoid> recordPetMemory(RecordData pet) async {\r\n    setState(() {\r\n      selectedPetId = pet['id'];\r\n      editingMemories = false;\r\n      memoryDate = DateUtils.dateOnly(korea(s.clock()));\r\n      tab = 1;\r\n    });\r\n    await editMemoryPhoto(initialDate: memoryDate, petId: pet['id']);\r\n  }\r\n\r\n  Widget dashboard() => Align(\r\n    alignment: Alignment.topCenter,\r\n    child: ConstrainedBox(\r\n      constraints: const BoxConstraints(maxWidth: 520),\r\n      child: Column(\r\n        key: const ValueKey('home-dashboard'),\r\n        crossAxisAlignment: CrossAxisAlignment.start,\r\n        children: [\r\n          title('함께라서 더 좋은 하루 🐾', '평범한 오늘이, 소중한 추억이 되는 곳'),\r\n          if (selectedPet == null)\r\n            Container(\r\n              width: double.infinity,\r\n              padding: const EdgeInsets.all(28),\r\n              decoration: BoxDecoration(\r\n                color: AppColors.surface,\r\n                borderRadius: BorderRadius.circular(22),\r\n                border: Border.all(color: AppColors.cardBorder),\r\n              ),\r\n              child: Column(\r\n                children: [\r\n                  const Icon(Icons.pets_outlined, size: 44, color: muted),\r\n                  const SizedBox(height: 12),\r\n                  const Text('우리 가족을 먼저 소개해 주세요.'),\r\n                  const SizedBox(height: 16),\r\n                  FilledButton(\r\n                    onPressed: () => editOwned('pets'),\r\n                    child: const Text('반려동물 등록'),\r\n                  ),\r\n                ],\r\n              ),\r\n            )\r\n          else\r\n            PetProfileCarousel(\r\n              pets: owned('pets'),\r\n              selectedId: selectedPet!['id'],\r"},{"path":"lib/screens/home_model.dart","sha256":"cb17d166e75a19699c1e5c21fbe7b0e0e7502559283259a8ffa581eb7eaf829d","excerpt":"import 'package:flutter/material.dart';\r\nimport '../store.dart';\r\n\r\nclass HomeModel extends ChangeNotifier {\r\n  HomeModel(this.s) {\r\n    memoryDate = DateUtils.dateOnly(korea(s.clock()));\r\n    memoryMonth = DateTime(memoryDate.year, memoryDate.month);\r\n  }\r\n  final PetStore s;\r\n  int tab = 0;\r\n  String filter = '전체';\r\n  bool editingMemories = false;\r\n  bool showMeetingMap = false;\r\n  String meetingCategory = '전체';\r\n  int chatSection = 0;\r\n  String? selectedPetId;\r\n  late DateTime memoryDate;\r\n  DateTime? homeDate;\r\n  late DateTime memoryMonth;\r\n\r\n  void update(VoidCallback action) {\r\n    action();\r\n    notifyListeners();\r\n  }\r\n\r\n  List\u003cRecordData> owned(String key) =>\r\n      s.rows(key).where((r) => r['owner'] == s.user).toList();\r\n  RecordData? get selectedPet {\r\n    final pets = owned('pets');\r\n    final selected = pets.where((pet) => pet['id'] == selectedPetId);\r\n    return selected.isNotEmpty\r\n        ? selected.first\r\n        : pets.isEmpty\r\n        ? null\r\n        : pets.first;\r\n  }\r\n\r\n  List\u003cRecordData> get selectedPetMemories => owned(\r\n    'memories',\r\n  ).where((photo) => photo['petId'] == selectedPet?['id']).toList();\r\n  DateTime? get selectedOrigin => s.memoryOriginFor(selectedPet?['id']);\r\n  DateTime? get selectedFirstPhoto => s.firstPhotoDateFor(selectedPet?['id']);\r\n  void selectPet(String id) => update(() {\r\n    selectedPetId = id;\r\n    editingMemories = false;\r\n    memoryDate = DateUtils.dateOnly(korea(s.clock()));\r\n  });\r\n}\r\n"},{"path":".agents/skills/document-sync/SKILL.md","sha256":"7239936f942f03567d50b5356e4cb3c5d062230e7cf60ab2ad362e5854ffe4c9","excerpt":"---\nname: document-sync\ndescription: Keep PetSNS documentation aligned with verified code changes.\n---\n\n# Documentation Sync\n\nRun after a task is implemented and verified.\n\n## Rules\n\n1. Inspect changed files and actual test results.\n2. Update documentation only when behavior, architecture,\n   constraints, status, or verification changes.\n3. Do not create new documents by default.\n4. Preserve important technical decisions and test evidence.\n5. Do not claim completion without verification.\n6. Do not modify unrelated documentation.\n\n## Document Ownership\n\n- README.md:\n  Technical setup and concise current implementation status.\n\n- docs/human/README.md:\n  Korean summary of current features, pending work,\n  and important changes understandable to non-developers.\n\n- PRD.md:\n  Feature task index, shared requirements, and task status.\n\n- docs/prd/:\n  Detailed requirements, technical decisions,\n  boundaries, and verification evidence.\n\n- docs/human/ui-guide.html:\n  Update only when UI structure or element identifiers change.\n\n- docs/human/task record/:\n  Preserve completed UI task evidence.\n  Do not create a new task record unless required.\n\n## Completion Report\n\nIn Korean, briefly state:\n- What changed.\n- What was verified.\n- Which documents were updated, or why none were needed.\n"}],"kind":"plan","title":"PetSNS 독립형 AI 개발 워크플로 계획","versions":[{"id":"v1","summary":"단일 문서형 검토 시안. 비교를 위한 초기 제안으로 보존.","mockups":[{"title":"단일 문서 구성","path":"draft-v1.svg"}],"decisions":[{"id":"D1","title":"독립 스킬 구성","proposal":"Plan, Verification, Issue Manager를 각각 독립 호출하며 문서 갱신은 기존 document-sync를 재사용한다.","reason":"단계별 작업을 다른 채팅에서도 이어갈 수 있도록 한다.","impact":"앱 기능·서비스 정책·사용자 저장 데이터를 변경하지 않는다.","requiresExplicitApproval":false,"proposalHash":"e60ebf87967d99bfa17c8ee626ee51172ae3011f89fd1e5e667f84f287f1512f"},{"id":"D2","title":"결정별 검토와 회차 기록","proposal":"결정과 시안·승인 이력을 한 페이지의 세로 문서에서 검토한다.","reason":"누가 다음 작업을 맡아도 정확한 검토 대상을 확인하도록 한다.","impact":"변경된 제안에는 과거 승인이 적용되지 않는다. 초기 선택은 보류다.","requiresExplicitApproval":false,"proposalHash":"393bbe68ac8ce399a8ff1e10a98cbaa8cba6ee205e306b5fd1b6263206a967ef"},{"id":"D3","title":"실제 검증 및 조건부 완료","proposal":"개발자 검증과 다른 실행자의 독립 QA를 분리한다. 웹 실행 캡처·환경·검증 이력을 기록하며, 미실행이나 중대 문제가 있으면 완료를 막는다.","reason":"문서상의 검증 계획과 실제 실행 결과를 구분한다.","impact":"사용자가 수용한 경미한 잔여 문제만 GitHub Issue 등록 대상이다.","requiresExplicitApproval":false,"proposalHash":"49fe789cd6f4dc7c48c525fdc023d3c1fb43d39f886397fda551f0c21912d541"}],"acceptance":["PRD·현재 코드의 경로와 해시가 HTML에 나 function assert(condition, message) { if (!condition) throw new Error(message); }
function nonempty(value) { return typeof value === 'string' && value.trim().length > 0; }
function unique(items, label) {
  assert(Array.isArray(items) && items.length > 0, `${label}: empty`);
  assert(items.every(x => nonempty(x.id) && !['__proto__','constructor','prototype'].includes(x.id)) && new Set(items.map(x => x.id)).size === items.length, `${label}: duplicate/missing/reserved id`);
}
function safePath(value) {
  return nonempty(value) && (/^https:\/\//i.test(value) || (!/^[a-z]+:|^[/\\]|(?:^|[/\\])\.\.(?:[/\\]|$)/i.test(value) && !/[<>]/.test(value)));
}
function validateReport(d) {
  assert(d.schemaVersion === 1 && ['plan', 'verification'].includes(d.kind), 'Unsupported report');
  for (const key of ['project', 'taskId', 'title']) assert(nonempty(d[key]), `Missing ${key}`);
  assert(/^[\w.-]+\/[\w.-]+$/.test(d.repository), 'Invalid repository');
  assert(/^[a-f\d]{40}$/i.test(d.revision), 'Expected exact Git revision');
  assert(Array.isArray(d.sources) && d.sources.length > 0, 'Missing source evidence');
  for (const s of d.sources) assert(nonempty(s.path) && /^[a-f\d]{64}$/i.test(s.sha256) && nonempty(s.excerpt), 'Invalid source evidence');
  if (d.kind === 'plan') {
    unique(d.versions, 'versions');
    for (const v of d.versions) {
      assert(nonempty(v.summary), 'Missing version summary');
      unique(v.decisions, 'decisions');
      for (const c of v.decisions) {
        for (const k of ['title', 'proposal', 'reason', 'impact']) assert(nonempty(c[k]), `Missing decision ${k}`);
        assert(typeof c.requiresExplicitApproval === 'boolean', 'Missing approval boundary');
      }
      assert(Array.isArray(v.acceptance) && v.acceptance.length > 0 && v.acceptance.every(nonempty), 'Missing acceptance criteria');
      assert(Array.isArray(v.mockups) && v.mockups.every(x => nonempty(x.title) && safePath(x.path)), 'Unsafe draft path');
    }
  } else {
    unique(d.runs, 'runs');
    for (const r of d.runs) {
      assert(['developer', 'independent-qa'].includes(r.role) && nonempty(r.actor), 'Invalid run actor/role');
      assert(/^[a-f\d]{40}$/i.test(r.revision) && Number.isFinite(Date.parse(r.executedAt)), 'Invalid run revision/time');
      assert(r.environment && /^https?:\/\//.test(r.environment.url) && nonempty(r.environment.viewport) && nonempty(r.environment.build), 'Missing runtime environment');
      unique(r.checks, 'checks');
      assert(Array.isArray(r.issues), 'Missing issues');
      if (r.issues.length) unique(r.issues, 'issues');
      for (const i of r.issues) {
        assert(['minor', 'major', 'critical'].includes(i.severity), 'Invalid severity');
        for (const k of ['title', 'location', 'actual', 'expected']) assert(nonempty(i[k]), `Missing issue ${k}`);
        assert(Array.isArray(i.steps) && i.steps.length && i.steps.every(nonempty), 'Missing reproduction');
      }
      for (const c of r.checks) {
        assert(nonempty(c.title) && nonempty(c.observed) && ['passed', 'failed', 'not-run'].includes(c.result), 'Invalid check');
        assert(Array.isArray(c.evidence) && Array.isArray(c.issueIds), 'Missing check evidence/issue mapping');
        assert(c.result === 'not-run' || c.evidence.length > 0, 'Executed check needs evidence');
        for (const e of c.evidence) {
          assert(['screenshot', 'command', 'source'].includes(e.kind), 'Invalid evidence kind');
          if (e.kind === 'command') assert(nonempty(e.command), 'Missing executed command');
          else assert(safePath(e.path), 'Unsafe evidence path');
          if (e.kind === 'screenshot') assert(Number.isFinite(Date.parse(e.capturedAt)), 'Missing capture time');

function currentRuns(d) {
  return ['developer', 'independent-qa'].map(role => d.runs.filter(r => r.role === role && r.revision === d.revision).at(-1)).filter(Boolean);

function readiness(d) {
  const runs = currentRuns(d), issues = [...new Map(runs.flatMap(r => r.issues).map(i => [i.id, i])).values()];
  const reasons = [];
  if (runs.length !== 2) reasons.push('현재 리비전의 개발자 검증과 독립 QA가 모두 필요합니다.');
  if (runs.length === 2 && (runs[0].actor === runs[1].actor || runs[0].environment.build !== runs[1].environment.build)) reasons.push('독립 실행자와 동일 빌드가 필요합니다.');
  for (const r of runs) {
    if (!r.checks.some(c => c.result !== 'not-run' && c.evidence.some(e => e.kind === 'screenshot'))) reasons.push(`${r.id}: 실제 화면 스크린샷이 없습니다.`);
    for (const c of r.checks) {
      if (c.result === 'not-run') reasons.push(`${r.id}/${c.id}: 미실행`);
      if (c.result !== 'not-run' && !c.evidence.some(e => ['screenshot', 'command'].includes(e.kind))) reasons.push(`${r.id}/${c.id}: 실행 증거 없음`);
      if (c.result === 'failed' && (!c.issueIds.length || c.issueIds.some(id => r.issues.find(i => i.id === id).severity !== 'minor'))) reasons.push(`${r.id}/${c.id}: 차단 실패`);

  return {status: reasons.length ? 'blocked' : issues.length ? 'conditional-complete' : 'complete', reasons, issues, runIds: runs.map(r => r.id)};
}
function validateRound(d, r) {
  assert(r && r.schemaVersion === 1 && r.kind === `${d.kind}-review`, 'Wrong review kind');
  for (const k of ['project', 'taskId', 'repository', 'revision', 'reportHash']) assert(r[k] === d[k], `Stale/wrong ${k}`);
  assert(Number.isInteger(r.round) && r.round > 0 && Number.isFinite(Date.parse(r.reviewedAt)), 'Invalid review round');
  if (d.kind === 'plan') {

    for (const c of r.decisions) assert(v.decisions.some(x => x.id === c.id && x.proposalHash === c.proposalHash) && choices.includes(c.status) && typeof c.note === 'string', 'Invalid decision review');
  } else {

    assert(r.computedStatus === ready.status && typeof r.note === 'string', 'Wrong verification result');

    if (r.verdict === 'approved') assert(ready.status === 'complete', 'Cannot approve incomplete verification');
    if (r.verdict === 'conditional-complete') assert(ready.status === 'conditional-complete' && ready.issues.every(i => r.acceptedIssueIds.includes(i.id)), 'Every minor issue needs explicit acceptance');

function options(value) { return report.versions.map(v=>`<option value="${esc(v.id)}" ${v.id===value?'selected':''}>${esc(v.id)} · ${esc(v.summary)}</option>`).join(''); }
function runBody(r) {
  return `<article class="card"><h2>${esc(r.id)} · ${r.role === 'independent-qa' ? '독립 QA' : '개발자 검증'}</h2><p>${esc(r.actor)} · ${esc(r.executedAt)}<br>${esc(r.environment.url)} · ${esc(r.environment.viewport)}<br>빌드 ${esc(r.environment.build)} · ${esc(r.revision)}</p>${r.checks.map(c=>`<article class="card"><h3 class="${c.result}">${esc(c.title)} · ${{passed:'통과',failed:'실패','not-run':'미실행'}[c.result]}</h3><p>${esc(c.observed)}</p>${c.evidence.map(e=>e.kind==='screenshot'?figures([{title:`${c.title} · ${e.capturedAt}`,path:e.path}],'실제 화면 증거'): `<pre>${esc(e.command || e.path)}</pre>`).join('')}${c.issueIds.length?`<p>연결 문제: ${c.issueIds.map(esc).join(', ')}</p>`:''}</article>`).join('')}${r.issues.map(i=>`<p class="${i.severity==='minor'?'muted':'blocked'}">${esc(i.id)} · ${esc(i.severity)} · ${esc(i.title)}<br>관찰: ${esc(i.actual)}<br>기대: ${esc(i.expected)}</p>`).join('')}</article>`;
}
function draw() {
  tabs.forEach(([id])=>document.getElementById(`tab-${id}`).setAttribute('aria-selected', String(id===active)));
  if (active === 'plan') {
    const v = report.versions.find(v=>v.id===selected);
    root.innerHTML = `<div class="toolbar"><label>시안 회차 <select id="version">${options(selected)}</select></label><span class="tag">${v===latestVersion?'현재 시안':'과거 시안, 현재 구현 승인에 사용하지 않음'}</span></div>${versionBody(v,true)}`;
    document.getElementById('version').onchange = e => { selected=e.target.value; draw(); };
    root.querySelectorAll('[data-decision]').forEach(el=>el.onchange=()=>{draft(v)[el.dataset.decision].status=el.value;persist();});
    root.querySelectorAll('[data-note]').forEach(el=>el.oninput=()=>{draft(v)[el.dataset.note].note=el.value;persist();});
  } else if (active === 'compare') {
    root.innerHTML = `<div class="compare">${[0,1].map((_,i)=>`<section><label>${i?'새 시안':'이전 시안'} <select id="compare-${i}">${options(i?latestVersion.id:report.versions[0].id)}</select></label><div id="version-${i}"></div></section>`).join('')}</div>`;
    const update = i => { const v=report.versions.find(v=>v.id===document.getElementById(`compare-${i}`).value); document.getElementById(`version-${i}`).innerHTML=versionBody(v,false); };
    for (let i=0;i<2;i++){update(i);document.getElementById(`compare-${i}`).onchange=()=>update(i);}
  } else if (active === 'sources') {
    root.innerHTML='<h2>실제 읽은 PRD·코드</h2>'+report.sources.map(s=>`<article class="card"><h3>${esc(s.path)}</h3><small>SHA-256 ${esc(s.sha256)}</small><pre>${esc(s.excerpt)}</pre></article>`).join('');
  } else if (['developer','qa'].includes(active)) {
    const role=active==='qa'?'independent-qa':'developer', r=currentRuns(report).find(r=>r.role===role);
    root.innerHTML=r?runBody(r):'<article class="card blocked">현재 리비전의 실행 기록이 없습니다. 미검증입니다.</article>';
  } else if (active === 'screens') {
    root.innerHTML='<h2>실제 웹 화면</h2>'+currentRuns(report).map(r=>`<h3>${esc(r.id)} · ${esc(r.actor)}</h3>`+r.checks.flatMap(c=>c.evidence.filter(e=>e.kind==='screenshot').map(e=>({title:`${c.title} · ${e.capturedAt}`,path:e.path}))).map(m=>figures([m],'실행 캡처')).join('')).join('');
  } else if (active === 'review') {
    const ready=readiness(report), review=state.drafts.verification||{verdict:'hold',note:'',acceptedIssueIds:[]};
    state.drafts.verification=review;
    root.innerHTML=`<article class="card"><h2 class="${ready.status==='blocked'?'blocked':'passed'}">검증 결과: ${{blocked:'완료 차단',complete:'완료 가능','conditional-complete':'조건부 완료 가능'}[ready.status]}</h2>${ready.reasons.map(x=>`<p>${esc(x)}</p>`).join('')}<label>최종 결정 <select id="verdict">${[['approved','승인'],['conditional-complete','조건부 완료'],['revise','수정'],['hold','보류']].map(([id,label])=>`<option value="${id}" ${review.verdict===id?'selected':''} ${((id==='approved'&&ready.status!=='complete')||(id==='conditional-complete'&&ready.status!=='conditional-complete'))?'disabled':''}>${label}</option>`).join('')}</select></label><label>메모<textarea id="review-note">${esc(review.note)}</textarea></label>${ready.issues.map(i=>`<label><input data-issue="${esc(i.id)}" type="checkbox" ${review.acceptedIssueIds.includes(i.id)?'checked':''} ${i.severity!=='minor'?'disabled':''}> 경미한 문제 수용: ${esc(i.title)} (${esc(i.id)}, ${esc(i.severity)})</label>`).join('')}</article>`;
    document.getElementById('verdict').onchange=e=>{review.verdict=e.target.value;persist();};
    document.getElementById('review-note').oninput=e=>{review.note=e.target.value;persist();};
    root.querySelectorAll('[data-issue]').forEach(el=>el.onchange=()=>{review.acceptedIssueIds=[...root.querySelectorAll('[data-issue]:checked')].map(x=>x.dataset.issue);persist();});
  } else if (active === 'history') {
    root.innerHTML='<h2>승인 회차 이력</h2>'+(!state.history.length?'<p>저장된 승인 회차 없음</p>':state.history.map(r=>`<article class="card"><h3>회차 ${r.round} · ${esc(r.reviewedAt)}</h3><p>${esc(r.versionId || r.verdict)}</p><pre>${esc(JSON.stringify(r.decisions || {verdict:r.verdict,acceptedIssueIds:r.acceptedIssueIds},null,2))}</pre><button data-download="${r.round}">이 회차 JSON 다운로드</button></article>`).join(''));
    if(report.kind==='verification') root.innerHTML+='<h2>모든 QA·개발자 실행 이력</h2>'+report.runs.map(runBody).join('');
    root.querySelectorAll('[data-download]').forEach(el=>el.onclick=()=>downloadRound(Number(el.dataset.download)));
  }
}
function envelope() {
  const common={schemaVersion:1,kind:`${report.kind}-review`,project:report.project,taskId:report.taskId,repository:report.repository,revision:report.revision,reportHash:report.reportHash,round:state.history.length+1,reviewedAt:new Date().toISOString()};
  if(report.kind==='plan') {
    const v=report.versions.find(v=>v.id===selected);
    return {...common,versionId:v.id,versionHash:v.versionHash,decisions:v.decisions.map(c=>({id:c.id,proposalHash:c.proposalHash,...draft(v)[c.id]}))};
  }
  const ready=readiness(report), r=state.drafts.verification||{verdict:'hold',note:'',acceptedIssueIds:[]};
  return {...common,runIds:ready.runIds,computedStatus:ready.status,...r};
}
function downloadRound(round) {
  if(storageError && !persist()) return;
  const entry=state.history[round-1], data={...entry,history:state.history.slice(0,round)};
  validateReview(report,data);
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})), a=document.createElement('a');
  a.href=url;a.download=`${report.taskId}-${report.kind}-round-${round}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  msg(`회차 ${round} JSON을 다운로드했습니다.`);
}
document.getElementById('save').onclick=()=>{
  try {
    const entry=envelope();validateRound(report,entry);
    const previous=state.history; state.history=[...previous,entry];
    if(!persist()){state.history=previous;return;}
    downloadRound(entry.round);if(active==='history')draw();
  } catch(e){msg(`저장 불가: ${e.message}`);}
};
document.getElementById('import').onchange=async event=>{
  const file=event.target.files[0];if(!file)return;
  try {
    const data=JSON.parse(await file.text());validateReview(report,data);
    assert(data.round>=state.history.length,'이전 JSON으로 현재 이력을 덮어쓸 수 없습니다.');
    state.history.forEach((r,i)=>assert(JSON.stringify(r)===JSON.stringify(data.history[i]),'기존 승인 이력과 충돌합니다.'));
    const next={drafts:structuredClone(state.drafts),history:data.history};
    for(const r of data.history) {
      if(report.kind==='plan')next.drafts[r.versionId]=Object.fromEntries(r.decisions.map(c=>[c.id,{status:c.status,note:c.note}]));
      else next.drafts.verification={verdict:r.verdict,note:r.note,acceptedIssueIds:r.acceptedIssueIds};
    }
    const previous=state;state=next;
    if(!persist()){state=previous;return;}
    if(report.kind==='plan')selected=data.versionId;
    draw();msg(`회차 ${data.round}까지 가져왔습니다.`);
  }catch(e){msg(`가져오기 거부: ${e.message}`);}
  event.target.value='';
};
draw();
</script></body></html>
